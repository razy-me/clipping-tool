<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipTool Overlay</title>
  <style>
    :root {
      --bg: rgba(10, 14, 26, 0.88);
      --border: rgba(99, 102, 241, 0.4);
      --acc: #6366f1;
      --acc2: #8b5cf6;
      --txt: #f8fafc;
      --mut: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .toast-pill {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 12px 35px -8px rgba(0, 0, 0, 0.7), 0 0 20px rgba(99, 102, 241, 0.25);
      color: var(--txt);
      opacity: 0;
      transform: translateY(-20px) scale(0.95);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      width: 100%;
      max-width: 320px;
    }

    .toast-pill.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: grid;
      place-items: center;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    .info-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .main-title {
      font-size: 13px;
      font-weight: 750;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .dur-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(99, 102, 241, 0.22);
      color: #c7d2fe;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }

    .game-name {
      font-size: 11.5px;
      color: var(--mut);
      font-weight: 550;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 2.5px;
      background: linear-gradient(90deg, var(--acc), var(--acc2));
      border-radius: 2px;
      transform-origin: left;
      transform: scaleX(1);
    }

    .toast-pill.visible .progress-bar {
      transition: transform 3s linear;
      transform: scaleX(0);
    }
    .toast-pill.error {
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 12px 35px -8px rgba(0, 0, 0, 0.7), 0 0 20px rgba(239, 68, 68, 0.35);
    }
    .toast-pill.error .icon-badge {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
    .toast-pill.error .dur-badge {
      background: rgba(239, 68, 68, 0.22);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .toast-pill.error .progress-bar {
      background: linear-gradient(90deg, #ef4444, #f87171);
    }
  </style>
</head>
<body>
  <div id="pill" class="toast-pill">
    <div class="icon-badge" id="pill-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="info-wrap">
      <div class="title-row">
        <span class="main-title" id="pill-title">Clip gespeichert!</span>
        <span id="clip-dur" class="dur-badge">30s</span>
      </div>
      <span id="game-title" class="game-name">Desktop</span>
    </div>
    <div class="progress-bar"></div>
  </div>

  <script type="module">
    import { listen } from '@tauri-apps/api/event';

    const pill = document.getElementById('pill');
    const pillIcon = document.getElementById('pill-icon');
    const pillTitle = document.getElementById('pill-title');
    const durEl = document.getElementById('clip-dur');
    const gameEl = document.getElementById('game-title');
    let hideTimeout = null;

    listen('overlay://show', (event) => {
      const data = event.payload || {};
      const game = data.game || 'Desktop';
      const dur = data.duration ? Math.round(data.duration) + 's' : 'Clip';

      pill.classList.remove('error');
      pillTitle.textContent = 'Clip gespeichert!';
      pillIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      gameEl.textContent = game;
      durEl.textContent = dur;

      if (hideTimeout) clearTimeout(hideTimeout);

      // Reset animation
      pill.classList.remove('visible');
      void pill.offsetWidth; // force reflow
      pill.classList.add('visible');

      hideTimeout = setTimeout(() => {
        pill.classList.remove('visible');
      }, 3000);
    });

    listen('overlay://error', (event) => {
      const data = event.payload || {};
      const msg = data.message || 'Fehler beim Speichern';

      pill.classList.add('error');
      pillTitle.textContent = 'Aufnahme fehlgeschlagen';
      pillIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
      gameEl.textContent = msg;
      durEl.textContent = 'Error';

      if (hideTimeout) clearTimeout(hideTimeout);

      pill.classList.remove('visible');
      void pill.offsetWidth;
      pill.classList.add('visible');

      hideTimeout = setTimeout(() => {
        pill.classList.remove('visible');
      }, 3500);
    });
  </script>
</body>
</html>
